input: "run_LB" # This flag can be LB or conditional or run_LB

run:
  delivery: FALSE

# paths
workspace_path: 'results_test'
destination_path: 'dest'

# LB
sumstats_list: 'config/example.txt'
labels:
  chr_label: "CHR"
  pos_label: "POS"
  p_label: "MLOG10P"
thresholds:
  p1: 1.178411501296253e-11
  p2: 1e-06
  hole: 3000000
loci_selection:
  NLP12: 0
  MHC: 0
  build: 38

# MR
#sumstats_path: '/scratch/gianmauro.cuccuru/pqtl_pipeline/believe/results_residuals/output'
mapping_filepath: '/exchange/healthds/pQTL/BELIEVE/Cis_trans_mapping/Build38_mapping_file/results/somascan_tss_ncbi_grch38_version_20251210.txt'
array_list_path: "data"
gtf_file: '/exchange/healthds/pQTL/BELIEVE/Cis_trans_mapping/Build38_mapping_file/GCF_000001405.40_GRCh38.p14_genomic.gtf'
params:
  nef: 4243
  Isquare: 90

# Backward literature
BL_config_file: 'config/config_backward_literature_believe.json'

# Single studies to be concatenated
single_studies:
  - CHRIS
  - INTERVAL

# hotspot_finder
hotspot_finder:
  hotspot_window_size: 5000000
  chr_col: "chr"
  start_col: "start"
  end_col: "end"
  hotspot_threshold: 50
  lonespot_window_size: 10000000
  lonespot_threshold: 1
